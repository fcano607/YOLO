# M5-06: a new common evaluation condition; do not compare directly to historical rect val.
schema_version: 1
purpose: b1_validation_only_deployment_quality
baseline: configs/baseline_products_v1.json
inference_config: configs/infer_products.yaml
loading_contract: data/desktop/metadata/products-v1_loading.json
previous_receipt: reports/deployment/M5-05_B1_backend_parity.json
split: val
input: {shape_hw: [640, 640], batch: 1, fp32: true, rect: false}
metric_postprocess: {conf: 0.001, iou: 0.7, max_det: 300, multi_label: true}
display_postprocess: {conf: 0.25, iou: 0.7, max_det: 300, multi_label: false}
ground_truth: {source: frozen_yolo_polygon_labels, coordinate_space: original_image, mask_downsample: 1, overlap: false}
metric_core: pinned_SegmentationValidator_process_batch_and_SegmentMetrics
iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
max_map50_95_drop: 0.005
